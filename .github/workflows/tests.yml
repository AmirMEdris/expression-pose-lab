name: Unit tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.5.4 opencv-contrib-python==4.11.0.86 pytest==9.2.0
      - run: python -m pytest
